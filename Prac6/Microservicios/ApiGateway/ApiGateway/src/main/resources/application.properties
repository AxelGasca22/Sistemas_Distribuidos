spring.application.name=apigateway
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=registryservice
spring.cloud.gateway.routes[0].uri=lb://registryservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/registry/**

spring.cloud.gateway.routes[1].id=metricservice
spring.cloud.gateway.routes[1].uri=lb://metricservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/metrics/**

spring.cloud.gateway.routes[2].id=scalingservice
spring.cloud.gateway.routes[2].uri=lb://scalingservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/scaling/**

spring.cloud.gateway.routes[3].id=failureservice
spring.cloud.gateway.routes[3].uri=lb://failureservice
spring.cloud.gateway.routes[3].predicates[0]=Path=/failure/**

logging.level.org.springframework.cloud.gateway=DEBUG