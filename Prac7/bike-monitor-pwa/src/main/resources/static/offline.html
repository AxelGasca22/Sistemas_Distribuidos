<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sin conexión - BikeStation Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            padding: 24px;
        }

        .offline-card {
            max-width: 520px;
            padding: 32px;
            text-align: center;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
        }

        h1 {
            margin-bottom: 14px;
            font-size: 30px;
        }

        p {
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="offline-card">
    <h1>Estás sin conexión</h1>
    <p>
        No fue posible conectarse al servidor. La aplicación puede mostrar datos guardados
        previamente cuando estén disponibles.
    </p>
    <a href="/">Volver al dashboard</a>
</div>

</body>
</html>
